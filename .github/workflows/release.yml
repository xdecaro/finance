name: Release Finance package

on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Read version
        run: echo "VERSION=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_ENV"

      - name: Refuse existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists"
            exit 1
          fi

      - name: Validate sources and Core boundary
        run: |
          find component plugins package tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/core-integration-smoke.php
          python3 - <<'PY'
          import json, pathlib, xml.etree.ElementTree as ET
          v = pathlib.Path('VERSION').read_text().strip()
          for p in ['component/decarofinance.xml','package/pkg_decarofinance.xml','updates/pkg_decarofinance.xml']:
              r = ET.parse(p).getroot()
              n = r.find('version') if r.tag == 'extension' else r.find('./update/version')
              assert n is not None and n.text == v, f'{p}: version mismatch'
          assets = json.loads(pathlib.Path('component/media/joomla.asset.json').read_text())
          assert assets.get('version') == v, 'Web Asset version mismatch'
          source = pathlib.Path('component/admin/src/Service/CoreIntegrationService.php').read_text()
          assert 'xdecaro\\Core' in source, 'canonical Core namespace missing'
          assert 'Xdecaro\\Core' not in source, 'deprecated Core namespace must not be consumed'
          assert "MINIMUM_CORE_VERSION = '1.4.0'" in source, 'Core minimum version mismatch'
          assert pathlib.Path(f'component/admin/sql/updates/mysql/{v}.sql').is_file(), 'schema version marker missing'
          PY
          ! grep -RniE 'DROP[[:space:]]+TABLE|TRUNCATE[[:space:]]+TABLE' component/admin/sql

      - name: Build deterministic packages
        run: |
          bash build/build.sh
          cp dist/SHA256SUMS.txt /tmp/finance-sums
          bash build/build.sh
          diff -u /tmp/finance-sums dist/SHA256SUMS.txt
          for file in dist/*.zip; do unzip -t "$file" >/dev/null; done

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${VERSION}" \
            dist/*.zip \
            dist/SHA256SUMS.txt \
            --title "Finance by xdecaro ${VERSION}" \
            --notes "Finance ${VERSION}: transactional and idempotent financial services, typed debtor/payer references, budgets and append-only deposit ledger, optional Notifications/Tasks reminders, Analytics provider and Core 1.4 capabilities."

      - name: Publish package checksum
        shell: bash
        run: |
          set -euo pipefail
          export PACKAGE_SHA="$(sha256sum "dist/pkg_decarofinance_${VERSION}.zip" | awk '{print $1}')"
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          path = Path('updates/pkg_decarofinance.xml')
          text = path.read_text()
          checksum = os.environ['PACKAGE_SHA']
          if re.search(r'<sha256>[^<]*</sha256>', text):
              text = re.sub(r'<sha256>[^<]*</sha256>', f'<sha256>{checksum}</sha256>', text, count=1)
          else:
              text = text.replace('<targetplatform', f'<sha256>{checksum}</sha256><targetplatform', 1)
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/pkg_decarofinance.xml
          git diff --cached --quiet || git commit -m "Publish SHA-256 for Finance ${VERSION}"
          git push
