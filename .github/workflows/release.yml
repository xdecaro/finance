name: Release Finance
on:
  push:
    branches: [main]
    paths: [VERSION]
permissions: {contents: write}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3', coverage: none}
      - name: Read version
        run: echo "VERSION=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_ENV"
      - name: Refuse existing release
        env: {GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        run: if gh release view "v${VERSION}" >/dev/null 2>&1; then echo "Release exists"; exit 1; fi
      - name: Validate and build
        run: |
          find component plugins package tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/core-integration-smoke.php
          chmod +x build/build.sh; build/build.sh; cp dist/SHA256SUMS.txt /tmp/sums; build/build.sh; diff -u /tmp/sums dist/SHA256SUMS.txt
      - name: Publish release
        env: {GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        run: gh release create "v${VERSION}" dist/*.zip dist/SHA256SUMS.txt --title "Finance by xdecaro ${VERSION}" --notes "Finance ${VERSION}: transactional/idempotent financial service, typed debtor/payer references, budgets/deposit ledger administration, optional Notifications/Tasks reminders, Analytics provider and Core 1.4 capabilities."
      - name: Publish package checksum
        shell: bash
        run: |
          set -euo pipefail; export PACKAGE_SHA="$(sha256sum "dist/pkg_decarofinance_${VERSION}.zip" | awk '{print $1}')"
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          p=Path('updates/pkg_decarofinance.xml'); t=p.read_text(); t=re.sub(r'<sha256>[^<]*</sha256>','',t); t=t.replace('<targetplatform',f'<sha256>{os.environ["PACKAGE_SHA"]}</sha256><targetplatform',1); p.write_text(t)
          PY
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git add updates/pkg_decarofinance.xml; git diff --cached --quiet || git commit -m "Publish SHA-256 for Finance ${VERSION}"; git push
