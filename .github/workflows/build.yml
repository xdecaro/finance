name: Finance CI
on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy: {fail-fast: false, matrix: {php: ['8.1','8.3']}}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '${{ matrix.php }}', coverage: none}
      - name: PHP syntax and smoke
        run: |
          find component plugins package tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/core-integration-smoke.php
          php tests/database-write-contract.php
          php tests/component-service-resolution.php
          php tests/admin-assets-contract.php
      - name: Validate metadata and safety
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"; test "$VERSION" = '1.5.3'
          python3 - <<'PY'
          import json,pathlib,xml.etree.ElementTree as ET
          v=pathlib.Path('VERSION').read_text().strip()
          for p in pathlib.Path('.').rglob('*.xml'): ET.parse(p)
          targets=['component/decarofinance.xml','package/pkg_decarofinance.xml','plugins/xdecaroanalytics/decarofinance/decarofinance.xml','plugins/task/decarofinance/decarofinance.xml','updates/pkg_decarofinance.xml']
          for p in targets:
              r=ET.parse(p).getroot(); n=r.find('version') if r.tag=='extension' else r.find('./update/version'); assert n is not None and n.text==v,(p,'version mismatch')
          assert json.loads(pathlib.Path('component/media/joomla.asset.json').read_text())['version']==v
          assert pathlib.Path(f'component/admin/sql/updates/mysql/{v}.sql').is_file()
          PY
          grep -Fq 'charset="utf8"' component/decarofinance.xml
          grep -Fq "MINIMUM_CORE_VERSION = '1.4.0'" component/admin/src/Service/CoreIntegrationService.php
          grep -Fq 'function upsertObligation' component/admin/src/Service/FinanceService.php
          grep -Fq 'function upsertPayment' component/admin/src/Service/FinanceService.php
          grep -Fq 'function allocatePaymentIdempotent' component/admin/src/Service/FinanceService.php
          grep -Fq 'function createAccount' component/admin/src/Service/FinanceService.php
          grep -Fq 'function recordTransaction' component/admin/src/Service/FinanceService.php
          grep -Fq 'function createOrder' component/admin/src/Service/FinanceService.php
          grep -Fq 'function approveOrder' component/admin/src/Service/FinanceService.php
          grep -Fq 'function executeOrder' component/admin/src/Service/FinanceService.php
          grep -Fq 'function getBudgetLineAvailability' component/admin/src/Service/FinanceService.php
          grep -Fq 'function transferBetweenAccounts' component/admin/src/Service/FinanceService.php
          grep -Fq 'function recordCashCheck' component/admin/src/Service/FinanceService.php
          grep -Fq 'function createStatement' component/admin/src/Service/FinanceService.php
          grep -Fq 'function addStatementLine' component/admin/src/Service/FinanceService.php
          grep -Fq 'function finaliseStatement' component/admin/src/Service/FinanceService.php
          grep -Fq 'function approveStatement' component/admin/src/Service/FinanceService.php
          ! grep -RniE 'DROP[[:space:]]+TABLE|TRUNCATE[[:space:]]+TABLE' component/admin/sql
          ! grep -RniE '#__(xdecaronotifications|xdecarotasks|xdecaroanalytics|xdecaropeople|xdecaroorganizations)_' component
          grep -Fq '<scriptfile>script.php</scriptfile>' package/pkg_decarofinance.xml
          grep -Fq "['install','discover_install']" package/script.php
      - name: Deterministic build
        run: |
          chmod +x build/build.sh; build/build.sh; cp dist/SHA256SUMS.txt /tmp/sums; build/build.sh; diff -u /tmp/sums dist/SHA256SUMS.txt
          for z in dist/*.zip; do unzip -t "$z" >/dev/null; done
  joomla-runtime:
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - {joomla: '4.4.14', php: '8.2', sha256: 'a1877816e070fa087529afcd73f214b7d5d76964d3ede0c3e6dfd354baad27b8'}
          - {joomla: '5.4.8', php: '8.3', sha256: '8d3585939bca8e6b1d5f3e97dda2cc557c61e610daf488c871e1f62a97be9bd0'}
          - {joomla: '6.1.3', php: '8.3', sha256: 'a49305652503f9344d046d55471f324a07882996132ed967c3b0fe34707ae4a1'}
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_ALLOW_EMPTY_PASSWORD: 'yes', MYSQL_DATABASE: joomla}
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '${{ matrix.php }}', extensions: 'mysqli,zip,simplexml', coverage: none}
      - name: Build package
        run: chmod +x build/build.sh && build/build.sh
      - name: Download verified Joomla
        shell: bash
        run: |
          set -euo pipefail; J='${{ matrix.joomla }}'; curl -fL --retry 3 "https://github.com/joomla/joomla-cms/releases/download/${J}/Joomla_${J}-Stable-Full_Package.zip" -o /tmp/joomla.zip; echo '${{ matrix.sha256 }}  /tmp/joomla.zip' | sha256sum --check --strict; mkdir joomla; unzip -q /tmp/joomla.zip -d joomla
      - name: Install Joomla and Finance without optional products
        shell: bash
        run: |
          set -euo pipefail; cd joomla
          php installation/joomla.php install --site-name='Finance CI' --admin-user='Finance CI Admin' --admin-username=admin --admin-password="FinanceCI-${GITHUB_RUN_ID}!" --admin-email=admin@example.invalid --db-type=mysqli --db-host=127.0.0.1 --db-user=root --db-pass='' --db-name=joomla --db-prefix=fin_ --db-encryption=0 --no-interaction
          VERSION="$(tr -d '\r\n' < "$GITHUB_WORKSPACE/VERSION")"; php cli/joomla.php extension:install --path="$GITHUB_WORKSPACE/dist/pkg_decarofinance_${VERSION}.zip" -vvv
      - name: Verify package, plugins and schema
        shell: bash
        run: |
          set -euo pipefail; MYSQL=(mysql --protocol=TCP -h127.0.0.1 -uroot --batch --skip-column-names joomla)
          test "$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM fin_extensions WHERE type='package' AND element='pkg_decarofinance';")" = 1
          test "$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM fin_extensions WHERE type='component' AND element='com_decarofinance';")" = 1
          test "$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM fin_extensions WHERE type='plugin' AND folder='xdecaroanalytics' AND element='decarofinance' AND enabled=1;")" = 1
          test "$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM fin_extensions WHERE type='plugin' AND folder='task' AND element='decarofinance' AND enabled=1;")" = 1
          test -f "$GITHUB_WORKSPACE/joomla/media/com_decarofinance/css/admin.css"
          test -f "$GITHUB_WORKSPACE/joomla/administrator/components/com_decarofinance/src/Helper/UiHelper.php"
          grep -Fq "com_decarofinance/css/admin.css" "$GITHUB_WORKSPACE/joomla/administrator/components/com_decarofinance/src/Helper/UiHelper.php"
          for t in budgets budget_lines obligations payments payment_allocations deposit_accounts deposit_movements transactions accounts orders order_approvals transfers cash_checks statements statement_lines; do test "$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='joomla' AND table_name='fin_decarofinance_${t}';")" = 1; done
          for c in debtor_component debtor_entity debtor_id; do test "$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='joomla' AND table_name='fin_decarofinance_obligations' AND column_name='${c}';")" = 1; done
          for c in payer_component payer_entity payer_id; do test "$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='joomla' AND table_name='fin_decarofinance_payments' AND column_name='${c}';")" = 1; done
          for c in owner_component owner_entity owner_id currency; do test "$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='joomla' AND table_name='fin_decarofinance_budgets' AND column_name='${c}';")" = 1; done
          for c in account_id budget_line_id category counterparty_component evidence_component created created_by; do test "$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='joomla' AND table_name='fin_decarofinance_transactions' AND column_name='${c}';")" = 1; done
          for c in required_approvals status evidence_component transaction_id; do test "$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='joomla' AND table_name='fin_decarofinance_orders' AND column_name='${c}';")" = 1; done
          for c in code owner_component owner_entity owner_id account_type currency; do test "$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='joomla' AND table_name='fin_decarofinance_accounts' AND column_name='${c}';")" = 1; done
          for c in from_account_id to_account_id out_transaction_id in_transaction_id; do test "$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='joomla' AND table_name='fin_decarofinance_transfers' AND column_name='${c}';")" = 1; done
          for c in expected_balance actual_balance difference evidence_component; do test "$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='joomla' AND table_name='fin_decarofinance_cash_checks' AND column_name='${c}';")" = 1; done
          for c in statement_type status finalised_by approved_by document_component; do test "$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='joomla' AND table_name='fin_decarofinance_statements' AND column_name='${c}';")" = 1; done
          schema="$("${MYSQL[@]}" -e "SELECT s.version_id FROM fin_schemas s JOIN fin_extensions e ON e.extension_id=s.extension_id WHERE e.type='component' AND e.element='com_decarofinance' LIMIT 1;")"
          test "$schema" = '1.5.3'
      - name: Exercise Finance 1.5.2 accounting writes
        shell: bash
        run: |
          set -euo pipefail
          FINANCE_JOOMLA_ROOT="$GITHUB_WORKSPACE/joomla" php tests/runtime-write-probe.php


  joomla-upgrade:
    runs-on: ubuntu-latest
    needs: validate
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_ALLOW_EMPTY_PASSWORD: 'yes', MYSQL_DATABASE: joomla}
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3', extensions: 'mysqli,zip,simplexml', coverage: none}
      - name: Build Finance 1.5.2 package
        run: chmod +x build/build.sh && build/build.sh
      - name: Download verified Joomla 6 and Finance 1.5.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://github.com/joomla/joomla-cms/releases/download/6.1.3/Joomla_6.1.3-Stable-Full_Package.zip" -o /tmp/joomla.zip
          echo 'a49305652503f9344d046d55471f324a07882996132ed967c3b0fe34707ae4a1  /tmp/joomla.zip' | sha256sum --check --strict
          curl -fL --retry 3 "https://github.com/xdecaro/finance/releases/download/v1.5.1/pkg_decarofinance_1.5.1.zip" -o /tmp/finance-1.5.1.zip
          echo '720cc3eeff97843f549f978c252a0f205428ece7f1dff59f36e01fa143d0a828  /tmp/finance-1.5.1.zip' | sha256sum --check --strict
          mkdir joomla
          unzip -q /tmp/joomla.zip -d joomla
      - name: Install Joomla and Finance 1.5.1
        shell: bash
        run: |
          set -euo pipefail
          cd joomla
          php installation/joomla.php install --site-name='Finance Upgrade CI' --admin-user='Finance CI Admin' --admin-username=admin --admin-password="FinanceUpgrade-${GITHUB_RUN_ID}!" --admin-email=admin@example.invalid --db-type=mysqli --db-host=127.0.0.1 --db-user=root --db-pass='' --db-name=joomla --db-prefix=fin_ --db-encryption=0 --no-interaction
          php cli/joomla.php extension:install --path=/tmp/finance-1.5.1.zip -vvv
      - name: Seed Finance 1.5.1 data
        shell: bash
        run: |
          set -euo pipefail
          mysql --protocol=TCP -h127.0.0.1 -uroot joomla <<'SQL'
          INSERT INTO fin_decarofinance_budgets (title,period_start,period_end,owner_component,owner_entity,owner_id,currency,state,created,created_by)
          VALUES ('Upgrade retained budget','2026-01-01','2026-12-31','com_example','organization','rome','EUR',1,'2026-09-01 10:00:00',1);
          INSERT INTO fin_decarofinance_accounts (external_key,owner_component,owner_entity,owner_id,name,account_type,identifier,currency,opening_balance,state,created,created_by)
          VALUES ('upgrade:account:1','com_example','organization','rome','Upgrade bank','bank','UPGRADE-IBAN','EUR',500.00,1,'2026-09-01 10:30:00',1);
          INSERT INTO fin_decarofinance_transactions (external_key,account_id,direction,category,amount,currency,occurred_at,source_component,source_entity,source_id,description,created,created_by)
          VALUES ('upgrade:transaction:1',LAST_INSERT_ID(),'expense','operations',42.50,'EUR','2026-09-01 11:00:00','com_example','record','42','Upgrade retained transaction','2026-09-01 11:00:00',1);
          INSERT INTO fin_decarofinance_obligations (external_key,source_component,source_entity,source_id,kind,description,amount,currency,due_date,status,created,created_by)
          VALUES ('upgrade:obligation:1','com_example','record','43','fee','Upgrade retained obligation',99.00,'EUR','2026-12-31','open','2026-09-01 12:00:00',1);
          SQL
      - name: Upgrade to Finance 1.5.2 and verify preservation
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          cd joomla
          php cli/joomla.php extension:install --path="$GITHUB_WORKSPACE/dist/pkg_decarofinance_${VERSION}.zip" -vvv
          MYSQL=(mysql --protocol=TCP -h127.0.0.1 -uroot --batch --skip-column-names joomla)
          test "$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM fin_decarofinance_budgets WHERE title='Upgrade retained budget';")" = 1
          test "$("${MYSQL[@]}" -e "SELECT currency FROM fin_decarofinance_budgets WHERE title='Upgrade retained budget' LIMIT 1;")" = 'EUR'
          test "$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM fin_decarofinance_transactions WHERE external_key='upgrade:transaction:1' AND amount=42.50;")" = 1
          test "$("${MYSQL[@]}" -e "SELECT created FROM fin_decarofinance_transactions WHERE external_key='upgrade:transaction:1' LIMIT 1;")" = '2026-09-01 11:00:00'
          test "$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM fin_decarofinance_accounts WHERE external_key='upgrade:account:1' AND opening_balance=500.00;")" = 1
          test "$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM fin_decarofinance_accounts WHERE external_key='upgrade:account:1' AND code IS NULL;")" = 1
          test "$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM fin_decarofinance_obligations WHERE external_key='upgrade:obligation:1' AND amount=99.00;")" = 1
          for t in accounts orders order_approvals transfers cash_checks statements statement_lines; do test "$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='joomla' AND table_name='fin_decarofinance_${t}';")" = 1; done
          schema="$("${MYSQL[@]}" -e "SELECT s.version_id FROM fin_schemas s JOIN fin_extensions e ON e.extension_id=s.extension_id WHERE e.type='component' AND e.element='com_decarofinance' LIMIT 1;")"
          test "$schema" = '1.5.3'
